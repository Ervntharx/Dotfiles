# Global skip rules. Matching is case-sensitive and applies to every path
# component and to the source-relative path.
blacklist:
  # Version-control and runtime artifacts
  - .git
  - __pycache__
  - "*.pyc"
  - "*.bak"
  - "*.bak.*"
  - "*~"
  - "*.log"
  - "*.pid"
  - "*.lock"

  # Credentials, keys, and secrets
  - .ssh
  - .gnupg
  - .pki
  - .aws
  - .netrc
  - .npmrc
  - .claude.json
  - ".env"
  - ".env.*"
  - "*.pem"
  - "*.key"
  - "*.p12"
  - "id_rsa*"
  - "id_ed25519*"
  - ai_api_keys.conf
  - auth.json
  - credentials.json
  - service.json
  - "secrets.*"
  - "tokens.*"
  - keyrings
  - password-store

  # Shell, input-method, and editor runtime data
  - fish_variables
  - htop_history
  - "user.dict"
  - "user.history"
  - "*.history"
  - "conf/cached_layouts"
  - backups
  - buffers

  # Browser, chat, and account-state data
