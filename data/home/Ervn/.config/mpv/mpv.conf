ao=pipewire

# 流媒体缓存,增大预读
cache=yes
cache-sesc=30
demuxer-max-bytes=150MiB
demuxer-max-back-bytes=50MiB

# 网络卡顿时暂停缓冲
cache-pause=yes
cache-pause-initial=yes
cache-pause-wait=3

#断线自动重联
stream-lavf-o-append=reconnect=1
stream-lavf-o-append=reconenct_streamed=1
stream-lavf-o-append=reconnect_delay_max=5

# 为了解决bilibili tui的播放卡顿问题
[low-latency]
cache=yes
cache-secs=30
demuxer-max-bytes=150MiB
audio-buffer=0.2
video-sync=audio
